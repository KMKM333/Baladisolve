# Manāra — Netlify configuration.
#
# This site is a single self-contained HTML file with no build step and no
# dependencies beyond CDN <script> tags. There is deliberately nothing to
# compile, so the build command is empty and the publish directory is the
# repo root, which is where index.html lives.
#
# This file exists mainly so continuous deploys from GitHub don't try to infer
# a build: without it Netlify may guess a framework and fail the deploy.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    # The whole app is this one file, and it changes on every deploy, so a
    # stale cached copy is the difference between shipping and not shipping.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    # Photos are static and now cached by the browser instead of being re-downloaded
    # inside the HTML on every visit. Not "immutable": filenames are stable, so
    # replacing a photo under the same name needs this window to lapse first.
    Cache-Control = "public, max-age=2592000"
